<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0D0D2B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Balloon Pop">
    <meta name="description" content="Retro 8-bit Pixel Art Subtraction Math Game for Kids">

    <title>Pixel Balloon Pop - Subtraction</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="apple-touch-icon" href="./icon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="game-container">
        <!-- Persistent Lively 8-Bit Canvas Background & Playfield -->
        <canvas id="game-canvas"></canvas>

        <!-- CRT Scanline Overlay -->
        <div id="crt-overlay"></div>

        <!-- ========================================== -->
        <!--             START SCREEN                   -->
        <!-- ========================================== -->
        <div id="start-screen" class="screen active">
            <div class="screen-content arcade-panel">
                <div class="badge-8bit">8-BIT MATH ARCADE</div>
                <h1 class="game-title">
                    <span class="title-line c-red">PIXEL</span>
                    <span class="title-line c-yellow">BALLOON</span>
                    <span class="title-line c-green">POP!</span>
                </h1>
                <p class="subtitle">SUBTRACTION CHALLENGE</p>

                <div class="difficulty-select">
                    <p class="select-label">SELECT LEVEL</p>
                    <div class="diff-buttons">
                        <button class="diff-btn selected" data-diff="easy" type="button">
                            <span class="diff-title">EASY</span>
                            <span class="diff-desc">Ages 5-6</span>
                            <span class="diff-range">1 to 10</span>
                        </button>
                        <button class="diff-btn" data-diff="medium" type="button">
                            <span class="diff-title">MEDIUM</span>
                            <span class="diff-desc">Ages 7-8</span>
                            <span class="diff-range">1 to 20</span>
                        </button>
                        <button class="diff-btn" data-diff="hard" type="button">
                            <span class="diff-title">HARD</span>
                            <span class="diff-desc">Ages 9-10</span>
                            <span class="diff-range">1 to 100</span>
                        </button>
                    </div>
                </div>

                <div class="menu-actions">
                    <button id="start-btn" class="pixel-btn big-btn pulse-btn" type="button">&#9654; START GAME</button>
                    <button id="menu-scores-btn" class="pixel-btn" type="button">&#9733; HIGH SCORES</button>
                    <button id="install-pwa-btn" class="pixel-btn install-btn hidden" type="button">&#11015; INSTALL APP</button>
                </div>

                <div class="start-controls">
                    <button id="sfx-toggle-menu" class="pixel-btn icon-btn" type="button" title="Toggle SFX">&#9835; SFX: ON</button>
                    <button id="music-toggle-menu" class="pixel-btn icon-btn" type="button" title="Toggle Music">&#9836; BGM: OFF</button>
                </div>

                <p class="hint-text">TAP BALLOON OR BUTTONS BELOW</p>
            </div>
        </div>

        <!-- ========================================== -->
        <!--              GAME SCREEN                   -->
        <!-- ========================================== -->
        <div id="game-screen" class="screen">
            <!-- Top HUD -->
            <header id="hud">
                <div id="hud-left">
                    <div id="hud-lives" aria-label="Lives remaining">
                        <span class="heart full">&hearts;</span>
                        <span class="heart full">&hearts;</span>
                        <span class="heart full">&hearts;</span>
                    </div>
                </div>
                <div id="hud-center">
                    <span class="hud-label">SCORE</span>
                    <span id="score-value">0</span>
                </div>
                <div id="hud-right">
                    <div class="streak-wrap">
                        <span class="hud-label">STREAK</span>
                        <span id="streak-value">0</span>
                    </div>
                    <span id="multiplier-badge" class="hidden">x2</span>
                </div>
            </header>

            <!-- Problem Banner + Timer Bar -->
            <div id="problem-banner">
                <div id="problem-box">
                    <span id="problem-text">10 &minus; 4 = <span class="c-yellow">?</span></span>
                </div>
                <div id="danger-bar-wrap">
                    <div id="danger-bar"></div>
                </div>
            </div>

            <!-- Interactive Play Area (Transparent pass-through to canvas) -->
            <div id="playfield-spacer"></div>

            <!-- Bottom Arcade Control Deck -->
            <footer id="arcade-deck">
                <div id="answer-area">
                    <button class="answer-btn" data-index="0" type="button">
                        <span class="key-hint">1</span>
                        <span class="answer-num">6</span>
                    </button>
                    <button class="answer-btn" data-index="1" type="button">
                        <span class="key-hint">2</span>
                        <span class="answer-num">4</span>
                    </button>
                    <button class="answer-btn" data-index="2" type="button">
                        <span class="key-hint">3</span>
                        <span class="answer-num">8</span>
                    </button>
                </div>

                <div id="game-controls">
                    <button id="pause-btn" class="pixel-btn ctrl-btn" type="button" title="Pause">&#10074;&#10074; PAUSE</button>
                    <button id="sfx-toggle-game" class="pixel-btn ctrl-btn" type="button" title="Toggle SFX">&#9835;</button>
                    <button id="music-toggle-game" class="pixel-btn ctrl-btn" type="button" title="Toggle Music">&#9836;✕</button>
                    <button id="home-btn" class="pixel-btn ctrl-btn" type="button" title="Menu">&#8962; MENU</button>
                </div>
            </footer>
        </div>

        <!-- ========================================== -->
        <!--             PAUSE OVERLAY                  -->
        <!-- ========================================== -->
        <div id="pause-overlay" class="overlay">
            <div class="overlay-box arcade-panel">
                <h2 class="overlay-title">PAUSED</h2>
                <button id="resume-btn" class="pixel-btn big-btn" type="button">&#9654; RESUME</button>
                <button id="quit-btn" class="pixel-btn" type="button">&#10006; MAIN MENU</button>
            </div>
        </div>

        <!-- ========================================== -->
        <!--           GAME OVER SCREEN                 -->
        <!-- ========================================== -->
        <div id="gameover-screen" class="screen">
            <div class="screen-content arcade-panel">
                <h1 class="gameover-title">
                    <span class="c-red">GAME</span>
                    <span class="c-yellow">OVER</span>
                </h1>

                <div id="new-highscore" class="hidden blink">&#9733; NEW RECORD! &#9733;</div>

                <div class="stats-box">
                    <div class="stat-row">
                        <span class="stat-label">FINAL SCORE</span>
                        <span class="stat-value" id="final-score">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">BALLOONS POPPED</span>
                        <span class="stat-value" id="final-popped">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">BEST STREAK</span>
                        <span class="stat-value" id="final-streak">0</span>
                    </div>
                </div>

                <div class="menu-actions">
                    <button id="play-again-btn" class="pixel-btn big-btn pulse-btn" type="button">&#9654; PLAY AGAIN</button>
                    <button id="go-scores-btn" class="pixel-btn" type="button">&#9733; HIGH SCORES</button>
                    <button id="go-home-btn" class="pixel-btn" type="button">&#8962; MAIN MENU</button>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!--          HIGH SCORES SCREEN                -->
        <!-- ========================================== -->
        <div id="highscores-screen" class="screen">
            <div class="screen-content arcade-panel">
                <h2 class="section-title">&#9733; HALL OF FAME &#9733;</h2>
                <div id="scores-list"></div>
                <button id="scores-back-btn" class="pixel-btn" type="button">&#8592; BACK</button>
            </div>
        </div>

        <!-- Full-screen flash overlay for feedback -->
        <div id="flash-overlay"></div>
    </div>

    <script src="./game.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
